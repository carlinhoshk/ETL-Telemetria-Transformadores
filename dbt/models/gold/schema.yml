version: 2

models:
  - name: dim_time
    description: Time dimension derived from silver measurement instants.
    columns:
      - name: time_key
        tests:
          - not_null
          - unique
      - name: is_weekend
        tests:
          - not_null

  - name: dim_transformer
    description: Conformed transformer design dimension.
    columns:
      - name: transformer_key
        tests:
          - not_null
          - unique
      - name: rated_power_mva
        tests:
          - not_null
      - name: hv_voltage_kv
        tests:
          - not_null
      - name: cooling_type
        tests:
          - not_null
      - name: application
        tests:
          - not_null

  - name: dim_location
    description: Synthetic site dimension (deterministic, fake).
    columns:
      - name: location_key
        tests:
          - not_null
          - unique
      - name: country
        tests:
          - accepted_values:
              values: ['Brazil']

  - name: dim_sensor
    description: Sensor catalog.
    columns:
      - name: sensor_name
        tests:
          - not_null
          - unique

  - name: fact_transformer_measurement
    description: Wide measurement fact table.
    columns:
      - name: time_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_time')
              field: time_key
      - name: transformer_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_transformer')
              field: transformer_key
      - name: location_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_location')
              field: location_key
      - name: load_percent
        tests:
          - not_null
      - name: thermal_stress_index
        tests:
          - not_null
      - name: state
        tests:
          - not_null
          - accepted_values:
              values: ['NORMAL', 'WARNING', 'CRITICAL']
